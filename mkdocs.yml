site_name: drf-batch cookbook
site_description: >-
  Runnable scenarios for drf-batch's cached fields: one option per page, with
  the batches it accepts and rejects.
copyright: BSD-3-Clause

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Overview: index.md
  - Related lookups:
      - 1. FK by primary key: 01-fk-by-pk.md
      - 2. FK by natural key: 02-fk-by-natural-key.md
      - 3. Scoped lookups: 03-scoped-lookups.md
      - 4. Two fields, one map: 04-shared-map.md
      - 5. A lookup for a plain column: 05-non-fk-lookup.md
  - Service fields:
      - 6. Writable service field: 06-writable-service.md
      - 7. Custom keys: 07-custom-keys.md
      - 8. Async services and timeouts: 08-async-services.md
  - Derived keys:
      - 9. Derived from one field: 09-derived-single.md
      - 10. Composite keys: 10-composite-keys.md
      - 11. Keys built by a callable: 11-key-callable.md
      - 12. Hidden model columns: 12-hidden-columns.md
      - 13. Chains: 13-chains.md
  - Fetch graph:
      - 14. Fetch order: 14-fetch-order.md
      - 15. Replacing collection: 15-replacing-collection.md
  - Operations:
      - 16. PUT, full replace: 16-put-replace.md
      - 17. DELETE: 17-delete.md
      - 18. Cross-row conflicts: 18-conflicts.md
      - 19. Write options: 19-write-options.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true

plugins:
  - search
